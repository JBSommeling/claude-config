name        = "maintainer-reviewer"
description = "Reviews a change through two lenses the other reviewers skip — would this be reasonable to maintain for five years, and is it consistent with the practices of this codebase. Use alongside code-reviewer before merge."

# high tier — $5.00/$30.00 per 1M tokens (in/out)
model = "gpt-5.6-sol"

model_reasoning_effort = "medium"

# Read-only agent — reviews and reports; does not edit files.
sandbox_mode = "read-only"
